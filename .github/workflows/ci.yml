name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EnterpriseCommerce.sln

      - name: Build (warnings are errors)
        run: dotnet build EnterpriseCommerce.sln --configuration Release --no-restore

      - name: Test (unit, integration, architecture)
        run: dotnet test --solution EnterpriseCommerce.sln --configuration Release --no-build

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate every profile with placeholder environment
        run: |
          cp .env.example .env
          for profile in sqlserver mongodb redis kafka all; do
            echo "Validating profile: $profile"
            docker compose --profile "$profile" config --quiet
          done
