# EnterpriseCommerce — local development infrastructure.
#
# Nothing starts by default: every service belongs to a profile.
#   docker compose --profile sqlserver up -d
#   docker compose --profile kafka --profile redis up -d
#   docker compose --profile all up -d
#
# Credentials come from deploy/docker/.env (gitignored). Create it from .env.example.
# Resource limits are sized for a 16 GB developer machine. See README.md in this folder.

name: enterprisecommerce

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    profiles: ["sqlserver", "all"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in deploy/docker/.env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 2560m
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  mongodb:
    image: mongo:8.0.38
    profiles: ["mongodb", "all"]
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set in deploy/docker/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in deploy/docker/.env}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # DEVELOPMENT ONLY: catches security emails from Identity's development mail sink (ADR-018 section 4).
  # Not part of "all": it is useful only while working on Identity email flows. Messages are not persisted.
  # Inbox: http://127.0.0.1:8025. SMTP: 127.0.0.1:1025 (no TLS, no authentication, loopback only).
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: ["mailsink"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8.8.4-alpine
    profiles: ["redis", "all"]
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in deploy/docker/.env}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in deploy/docker/.env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  # Dedicated BFF session store (ADR-016 section 3). Never shared with caching: noeviction, so active sessions are
  # never evicted (a full store fails writes, and the BFF fails closed); append-only persistence, so sessions survive
  # a restart. The BFF refuses to start if the policy is anything but noeviction. The "redis" service keeps allkeys-lru.
  redis-sessions:
    image: redis:8.8.4-alpine
    profiles: ["bff", "all"]
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_SESSIONS_PASSWORD:?REDIS_SESSIONS_PASSWORD must be set in deploy/docker/.env}"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
    environment:
      REDISCLI_AUTH: ${REDIS_SESSIONS_PASSWORD:?REDIS_SESSIONS_PASSWORD must be set in deploy/docker/.env}
    ports:
      - "127.0.0.1:${REDIS_SESSIONS_PORT:-6380}:6379"
    volumes:
      - redis-sessions-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli config get maxmemory-policy | grep -q noeviction"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  # Single-node Kafka in KRaft mode (combined broker + controller, no ZooKeeper).
  # Containers on the compose network use kafka:9092; host applications use 127.0.0.1:9094.
  # The external listener advertises 127.0.0.1, the only address its port is published on. Advertising "localhost"
  # made every new client try [::1] first wherever localhost resolves to IPv6 first (Windows): nothing listens there,
  # and Windows refuses such a connect only after about 2 seconds (docs/testing TS-5).
  kafka:
    image: apache/kafka:4.4.0
    profiles: ["kafka", "all"]
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set in deploy/docker/.env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_EXTERNAL_PORT:-9094}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Topics are created explicitly (by design), never implicitly by a producer typo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      # Small heap for the CLI tool so the check does not inherit the broker heap settings.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  # One-shot: creates the topics of kafka/topics.txt once the broker is healthy, then exits with 0. Idempotent.
  kafka-init:
    image: apache/kafka:4.4.0
    profiles: ["kafka", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/topics/create-topics.sh", "/topics/topics.txt"]
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_HEAP_OPTS: "-Xmx128m"
    volumes:
      - ./kafka:/topics:ro
    mem_limit: 256m
    restart: "no"
    logging: *default-logging

volumes:
  sqlserver-data:
  mongodb-data:
  mongodb-config:
  redis-data:
  redis-sessions-data:
  kafka-data:
